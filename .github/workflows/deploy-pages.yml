name: Deploy Dalma Roleplay to GitHub Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - 'app-source/**'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Prepare static site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p extracted
          unzip -q dalma_render_deploy.zip -d extracted


          PACKAGE_JSON="$(find extracted -name package.json -not -path '*/node_modules/*' -print -quit || true)"
          if [ -n "$PACKAGE_JSON" ]; then
            APP_DIR="$(dirname "$PACKAGE_JSON")"
            if [ -f "$APP_DIR/public/index.html" ]; then
              OUTPUT_DIR="$APP_DIR/public"
            elif [ -f "$APP_DIR/index.html" ]; then
              OUTPUT_DIR="$APP_DIR"
            else
              cd "$APP_DIR"
              if [ -f package-lock.json ]; then npm ci; else npm install; fi
              if node -e "const p=require('./package.json'); process.exit(p.scripts && p.scripts.build ? 0 : 1)"; then
                npm run build
                if [ -f dist/index.html ]; then OUTPUT_DIR="$APP_DIR/dist"
                elif [ -f build/index.html ]; then OUTPUT_DIR="$APP_DIR/build"
                elif [ -f out/index.html ]; then OUTPUT_DIR="$APP_DIR/out"
                else
                  echo "Build completed, but no supported output folder with index.html was found."
                  exit 1
                fi
              else
                echo "No public/index.html, root index.html, or build script was found."
                exit 1
              fi
            fi
          else
            INDEX_FILE="$(find extracted -name index.html -print -quit || true)"
            if [ -z "$INDEX_FILE" ]; then
              echo "No index.html was found in the uploaded ZIP."
              exit 1
            fi
            OUTPUT_DIR="$(dirname "$INDEX_FILE")"
          fi

          if [ -f "$GITHUB_WORKSPACE/app-source/public/index.html" ]; then OUTPUT_DIR="$GITHUB_WORKSPACE/app-source/public"; fi
          test -f "$OUTPUT_DIR/index.html"
          mkdir -p "$GITHUB_WORKSPACE/_site"
          cp -a "$OUTPUT_DIR"/. "$GITHUB_WORKSPACE/_site"/
          printf '\n<style>#accessModal{display:none!important}</style>\n' >> "$GITHUB_WORKSPACE/_site/index.html"
          touch "$GITHUB_WORKSPACE/_site/.nojekyll"
          echo "Publishing files from: $OUTPUT_DIR"
          find "$GITHUB_WORKSPACE/_site" -maxdepth 2 -type f -print

      - name: Make application source available for maintenance
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f app-source/server.js ]; then
            mkdir -p app-source/public
            cp extracted/dalma-deploy/server.js app-source/server.js
            cp extracted/dalma-deploy/package.json app-source/package.json
            if [ -f extracted/dalma-deploy/README.md ]; then cp extracted/dalma-deploy/README.md app-source/README.md; fi
            cp -a extracted/dalma-deploy/public/. app-source/public/
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app-source
          if ! git diff --cached --quiet; then
            git commit -m 'Expose application source for maintenance'
            git push
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
